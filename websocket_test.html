<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMP AIoT WebSocket Test Dashboard</title>
    <!-- Load Socket.IO client CDN -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f172a;
            color: #cbd5e1;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 9999px;
            font-weight: bold;
            font-size: 14px;
        }

        .status-connected {
            background: #064e3b;
            color: #34d399;
        }

        .status-disconnected {
            background: #7f1d1d;
            color: #f87171;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .metric-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 5px;
        }

        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 8px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #0369a1;
        }

        .btn-red {
            background: #b91c1c;
        }

        .btn-red:hover {
            background: #991b1b;
        }

        .btn-green {
            background: #059669;
        }

        .btn-green:hover {
            background: #047857;
        }

        pre {
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid #334155;
            color: #10b981;
        }
    </style>
</head>

<body>

    <h1>PMP AIoT Weigh Feeder WebSocket Monitor</h1>

    <div class="panel">
        <h3>Connection Status</h3>
        <div>
            Host Address: <strong>http://localhost:3001</strong>
        </div>
        <div style="margin-top: 10px;">
            Status: <span id="status-badge" class="status-badge status-disconnected">DISCONNECTED</span>
        </div>
    </div>

    <div class="panel">
        <h3>Feeder State Controller</h3>
        <div style="margin-bottom: 15px;">
            <label for="setpoint-range">Target Setpoint: <span id="setpoint-label"
                    style="font-weight: bold; color: #38bdf8;">50</span> t/h</label><br>
            <input type="range" id="setpoint-range" min="10" max="90" value="50" style="width: 100%; margin-top: 8px;"
                onchange="updateSetpoint(this.value)">
        </div>
        <div>
            <button class="btn btn-red" onclick="injectFailure('FM-01')">Drift Anomaly (FM-01)</button>
            <button class="btn btn-red" onclick="injectFailure('FM-02')">Belt Slip (FM-02)</button>
            <button class="btn btn-red" onclick="injectFailure('FM-03')">Bearing Wear (FM-03)</button>
            <button class="btn btn-red" onclick="injectFailure('FM-04')">Chute Block (FM-04)</button>
            <button class="btn btn-red" onclick="injectFailure('FM-05')">Mistracking (FM-05)</button>
            <button class="btn btn-green" onclick="resetFeeder()">Reset Feeder</button>
        </div>
    </div>

    <div class="panel">
        <h3>Live Measurements</h3>
        <div class="grid">
            <div class="metric-card">
                <div>Feeder State</div>
                <div id="metric-state" class="metric-value">-</div>
            </div>
            <div class="metric-card">
                <div>Health Score</div>
                <div id="metric-health" class="metric-value">-</div>
            </div>
            <div class="metric-card">
                <div>Feed Rate (Actual)</div>
                <div id="metric-feedrate" class="metric-value">-</div>
            </div>
            <div class="metric-card">
                <div>Belt Load</div>
                <div id="metric-load" class="metric-value">-</div>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>Raw Telemetry Snapshot</h3>
        <pre id="raw-json">Waiting for telemetry packets...</pre>
    </div>

    <script>
        const socket = io("http://localhost:3001");
        const statusBadge = document.getElementById("status-badge");
        const rawJson = document.getElementById("raw-json");
        const setpointRange = document.getElementById("setpoint-range");
        const setpointLabel = document.getElementById("setpoint-label");

        // UI Metrics
        const metricState = document.getElementById("metric-state");
        const metricHealth = document.getElementById("metric-health");
        const metricFeedrate = document.getElementById("metric-feedrate");
        const metricLoad = document.getElementById("metric-load");

        socket.on("connect", () => {
            statusBadge.textContent = "CONNECTED";
            statusBadge.className = "status-badge status-connected";
        });

        socket.on("disconnect", () => {
            statusBadge.textContent = "DISCONNECTED";
            statusBadge.className = "status-badge status-disconnected";
            rawJson.textContent = "Connection dropped. Reconnecting...";
        });

        // Telemetry Stream Listener
        socket.on("telemetry:stream", (payload) => {
            rawJson.textContent = JSON.stringify(payload, null, 2);

            // Update Quick View Cards
            metricState.textContent = payload.state;
            metricHealth.textContent = payload.healthScore + "%";
            metricFeedrate.textContent = payload.sensors.feed_rate_actual.value + " t/h";
            metricLoad.textContent = payload.sensors.belt_load.value + " kg/m";

            // Align setpoint range slider if updated elsewhere
            setpointLabel.textContent = payload.sensors.feed_rate_setpoint.value;
            setpointRange.value = payload.sensors.feed_rate_setpoint.value;

            // Color State text
            if (payload.state === "RUNNING") {
                metricState.style.color = "#10b981";
            } else if (payload.state === "DEGRADED" || payload.state === "PRE_FAILURE") {
                metricState.style.color = "#fbbf24";
            } else {
                metricState.style.color = "#ef4444";
            }
        });

        // WebSocket Control Triggers
        function updateSetpoint(val) {
            setpointLabel.textContent = val;
            socket.emit("control:setpoint", { setpoint: parseInt(val, 10) });
        }

        function injectFailure(mode) {
            socket.emit("control:failure", { mode: mode });
        }

        function resetFeeder() {
            socket.emit("control:reset");
        }
    </script>
</body>

</html>
