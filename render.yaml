services:
  # ============================================================================
  # 1. Telemetry & Sensor Simulator Web Service (Node.js + Socket.IO)
  # ============================================================================
  - type: web
    name: pmp-sensor-simulator
    runtime: node
    plan: free
    rootDir: sensor_simulator
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_EMBEDDED_MQTT
        value: "false" # Set to "true" if running locally or using a dedicated broker
      - key: MQTT_BROKER_URL
        value: "mqtt://127.0.0.1:1883"
      - key: MQTT_CLIENT_ID
        value: "weigh_feeder_sim"
      - key: TICK_INTERVAL_MS
        value: "2000"
      - key: TIME_ACCELERATION
        value: "10.0"
      - key: MONGO_ENABLED
        value: "false" # Set to "true" in Render dashboard once you provide MONGO_URI
      - key: MONGO_URI
        sync: false # Paste your MongoDB Atlas URI in Render dashboard Environment tab

  # ============================================================================
  # 2. AI ML Prognostics & Maintenance Copilot (Python FastAPI)
  # ============================================================================
  - type: web
    name: pmp-ai-backend
    runtime: python
    plan: free
    rootDir: ai_backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # ============================================================================
  # 3. Industrial Digital Twin Dashboard (React SPA Static Site)
  # ============================================================================
  - type: web
    name: pmp-frontend
    runtime: static
    rootDir: pmp_FE
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: "https://pmp-sensor-simulator.onrender.com"
      - key: VITE_AI_BACKEND_URL
        value: "https://pmp-ai-backend.onrender.com"
